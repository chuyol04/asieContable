services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_credentials
      GOOGLE_DRIVE_OAUTH_CREDENTIALS_PATH: /run/secrets/google_drive_oauth
      GOOGLE_DRIVE_OAUTH_TOKEN_PATH: /app/data/drive/token.json
      GOOGLE_DRIVE_REDIRECT_URI: https://${APP_DOMAIN}/api/google-drive/callback
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_DRIVE_DOCUMENTS_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_DOCUMENTS_ROOT_FOLDER_ID:-}
    expose:
      - "3000"
    secrets:
      - firebase_credentials
      - google_drive_oauth
    volumes:
      - drive_tokens:/app/data/drive
      - app_storage:/app/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.asiecontable.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.asiecontable.entrypoints=websecure"
      - "traefik.http.routers.asiecontable.tls=true"
      - "traefik.http.routers.asiecontable.tls.certresolver=letsencrypt"
      - "traefik.http.services.asiecontable.loadbalancer.server.port=3000"

secrets:
  firebase_credentials:
    file: ${FIREBASE_CREDENTIALS_FILE}
  google_drive_oauth:
    file: ${GOOGLE_DRIVE_OAUTH_CREDENTIALS_FILE}

volumes:
  drive_tokens:
  app_storage:
